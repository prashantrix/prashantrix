<g fill="#f4ecff">
  <circle cx="701" cy="142" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1199" cy="265" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="872" cy="440" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
<rect x="16" y="0" width="1248" height="3" fill="#40e0d0" opacity=".7" filter="url(#glow)"><animate attributeName="y" values="20;520;20" dur="7s" repeatCount="indefinite"/></rect>
<text x="54" y="506" font-family="monospace" font-size="13" fill="#71829f">ANALYZE / VISUALIZE / AUTOMATE / REPEAT</text>
<text x="1220" y="506" text-anchor="end" font-family="monospace" font-size="13" fill="#71829f">GITHUB.COM/PRASHANTRIX</text>
