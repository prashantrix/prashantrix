<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
<title id="title">Prashant Kashyap — Data Analyst and AI Enthusiast</title>
<desc id="desc">Original animated neon developer hero with a stylized anime-inspired analyst, dashboard holograms, and animated role text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08121f"/><stop offset=".54" stop-color="#10162b"/><stop offset="1" stop-color="#20102f"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#40e0d0"><animate attributeName="stop-color" values="#40e0d0;#a78bfa;#ff76c8;#40e0d0" dur="9s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#ff76c8"><animate attributeName="stop-color" values="#ff76c8;#40e0d0;#a78bfa;#ff76c8" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
  <radialGradient id="halo"><stop stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8ea5ca" stroke-opacity=".08"/></pattern>
  <clipPath id="round"><rect width="1280" height="540" rx="26"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1280" height="540" fill="url(#bg)"/><rect width="1280" height="540" fill="url(#grid)"/>
<circle cx="920" cy="255" r="300" fill="url(#halo)"><animate attributeName="r" values="270;320;270" dur="7s" repeatCount="indefinite"/></circle>
<rect x="3" y="3" width="1274" height="534" rx="24" fill="none" stroke="url(#neon)" stroke-width="2" stroke-opacity=".82"/>
<text x="54" y="54" font-family="monospace" font-size="15" letter-spacing="3" fill="#95a5c4">PRASHANTRIX / DIGITAL SPACE</text>
<text x="54" y="112" font-family="Arial,sans-serif" font-size="23" fill="#40e0d0">HELLO, WORLD. I'M</text>
<text x="50" y="178" font-family="Arial,sans-serif" font-weight="800" font-size="57" fill="#f5f7ff">PRASHANT</text>
<text x="50" y="239" font-family="Arial,sans-serif" font-weight="800" font-size="57" fill="url(#neon)" filter="url(#glow)">KASHYAP</text>
<path d="M54 260H540" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 500;500 0;0 500" dur="6s" repeatCount="indefinite"/></path>
<text x="54" y="302" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#ecebff">Data Analyst <tspan fill="#ff76c8">·</tspan> AI Enthusiast</text>
<text x="54" y="338" font-family="Arial,sans-serif" font-size="18" fill="#aab7d1">Turning data into insights, one query at a time.</text>
<g font-family="monospace" font-size="13" fill="#bfcce4">
<rect x="54" y="370" width="420" height="42" rx="8" fill="#0a101d" stroke="#3a4d66"/><text x="70" y="396" fill="#40e0d0">prashant@analytics:~$</text><text x="255" y="396" fill="#f5f7ff">build insight<span><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></span></text>
</g>
<g font-family="Arial,sans-serif" font-size="14" font-weight="700">
<g><rect x="54" y="435" width="67" height="32" rx="16" fill="#102b34" stroke="#40e0d0"/><text x="87" y="456" fill="#d8fffa" text-anchor="middle">SQL</text></g>
<g><rect x="130" y="435" width="82" height="32" rx="16" fill="#201638" stroke="#a78bfa"/><text x="171" y="456" fill="#ece2ff" text-anchor="middle">Excel</text></g>
<g><rect x="221" y="435" width="104" height="32" rx="16" fill="#2a1630" stroke="#ff76c8"/><text x="273" y="456" fill="#ffe4f6" text-anchor="middle">Power BI</text></g>
<g><rect x="334" y="435" width="87" height="32" rx="16" fill="#102b34" stroke="#40e0d0"/><text x="377" y="456" fill="#d8fffa" text-anchor="middle">Python</text></g>
<g><rect x="430" y="435" width="125" height="32" rx="16" fill="#201638" stroke="#a78bfa"/><text x="492" y="456" fill="#ece2ff" text-anchor="middle">PostgreSQL</text></g>
</g>
