<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">Prashant Kashyap — Data Analyst and AI Enthusiast</title>
<desc id="desc">Animated neon analyst portfolio banner with a typing terminal, letter-by-letter name reveal, cycling roles, holographic anime artwork, data pipeline, code editor and glowing motto.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080813"/><stop offset=".48" stop-color="#17102b"/><stop offset="1" stop-color="#071b26"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#ff54c9"><animate attributeName="stop-color" values="#ff54c9;#bd8cff;#49e4dc;#ff54c9" dur="8s" repeatCount="indefinite"/></stop><stop offset=".52" stop-color="#a87cff"><animate attributeName="stop-color" values="#a87cff;#4fe5dd;#ff54c9;#a87cff" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#43e3d8"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#46e8dc"/><stop offset="1" stop-color="#9b8bff"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#8b5cf6" stop-opacity=".34"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11172a" stop-opacity=".97"/><stop offset="1" stop-color="#1a0d2a" stop-opacity=".97"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13"/></filter>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#b9a9ff" stroke-opacity=".075"/></pattern>
 <clipPath id="round"><rect width="1280" height="740" rx="30"/></clipPath>
 <clipPath id="characterReveal"><rect x="0" y="0" width="470" height="0"><animate attributeName="height" from="0" to="470" dur="2.1s" begin=".5s" fill="freeze"/></rect></clipPath>
</defs>
<g clip-path="url(#round)">
 <rect width="1280" height="740" fill="url(#bg)"/>
 <rect width="1280" height="740" fill="url(#grid)"/>
 <circle cx="985" cy="282" r="330" fill="url(#orb)"><animate attributeName="r" values="290;350;290" dur="7s" repeatCount="indefinite"/></circle>
 <circle cx="290" cy="565" r="240" fill="#fa4dc5" opacity=".055"><animate attributeName="opacity" values=".025;.09;.025" dur="6s" repeatCount="indefinite"/></circle>
 <rect x="3" y="3" width="1274" height="734" rx="27" fill="none" stroke="url(#neon)" stroke-width="2"/>
 <!-- Terminal -->
 <rect x="42" y="30" width="1196" height="55" rx="12" fill="#080b15" stroke="#55466f" stroke-width="1.3"/>
 <circle cx="65" cy="57" r="5" fill="#ff618c"/><circle cx="83" cy="57" r="5" fill="#ffd166"/><circle cx="101" cy="57" r="5" fill="#4ce0ae"/>
 <text x="123" y="63" font-family="monospace" font-size="17" fill="#c9b9ec">prashant@analytics:~$</text>
 <text x="337" y="63" font-family="monospace" font-size="17" fill="#56e4d8">whoami <tspan fill="#ffffff">▍<animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/></tspan></text>
 <text x="1197" y="63" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2" fill="#8b80ab">PROFILE.INIT</text>
 <!-- Title and rotating roles -->
 <text x="58" y="139" font-family="monospace" font-size="15" letter-spacing="4" fill="#9c90bc">HELLO, WORLD. I'M</text>
 <text x="53" y="220" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.8" fill="url(#neon)" filter="url(#glow)"><tspan opacity="0">PR<tspan><animate attributeName="opacity" values="0;1" begin="1.1s" dur=".4s" fill="freeze"/></tspan></tspan><tspan opacity="0">A<tspan><animate attributeName="opacity" values="0;1" begin="1.25s" dur=".4s" fill="freeze"/></tspan></tspan><tspan opacity="0">SH<tspan><animate attributeName="opacity" values="0;1" begin="1.4s" dur=".4s" fill="freeze"/></tspan></tspan><tspan opacity="0">ANT<tspan><animate attributeName="opacity" values="0;1" begin="1.55s" dur=".4s" fill="freeze"/></tspan></tspan></text>
 <text x="53" y="291" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.8" fill="url(#neon)" filter="url(#glow)">KASHYAP<animate attributeName="opacity" values=".45;1;.45" dur="4.8s" repeatCount="indefinite"/></text>
 <path d="M58 310H666" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 620;600 20;0 620" dur="7s" repeatCount="indefinite"/></path>
 <g font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">
  <text x="58" y="356" fill="#f9f4ff" opacity="0">Data Analyst <tspan fill="#ff71d0">·</tspan><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.22;.28;.64;.7;1" dur="9s" repeatCount="indefinite"/></text>
  <text x="58" y="356" fill="#f9f4ff" opacity="0">BI &amp; Dashboard Builder <tspan fill="#ff71d0">·</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.27;.56;.64;1" dur="9s" repeatCount="indefinite"/></text>
  <text x="58" y="356" fill="#f9f4ff" opacity="0">AI &amp; Automation Enthusiast <tspan fill="#ff71d0">·</tspan><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.48;.55;.68;.94;1" dur="9s" repeatCount="indefinite"/></text>
 </g>
 <!-- Quote / signature -->
 <rect x="54" y="380" width="630" height="57" rx="12" fill="#0b0a18" stroke="#5f426f"/>
 <rect x="54" y="380" width="4" height="57" rx="2" fill="url(#neon)"/>
 <text x="75" y="404" font-family="monospace" font-size="11" letter-spacing="2" fill="#9f90bf">MY RULE OF THUMB</text>
 <text x="75" y="424" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#f4eaff">Curiosity first. Evidence over guesses.</text>
 <!-- Skills -->
 <g font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">
  <g><rect x="56" y="456" width="88" height="37" rx="18" fill="#20142d" stroke="#ff68d2"/><text x="100" y="480" text-anchor="middle" fill="#ffe1f7">SQL</text></g>
  <g><rect x="154" y="456" width="100" height="37" rx="18" fill="#20142d" stroke="#a98aff"/><text x="204" y="480" text-anchor="middle" fill="#f0e5ff">Excel</text></g>
  <g><rect x="264" y="456" width="122" height="37" rx="18" fill="#20142d" stroke="#ff68d2"/><text x="325" y="480" text-anchor="middle" fill="#ffe1f7">Power BI</text></g>
  <g><rect x="396" y="456" width="105" height="37" rx="18" fill="#20142d" stroke="#a98aff"/><text x="448.5" y="480" text-anchor="middle" fill="#f0e5ff">Python</text></g>
  <g><rect x="511" y="456" width="153" height="37" rx="18" fill="#20142d" stroke="#45dcd2"/><text x="587.5" y="480" text-anchor="middle" fill="#d3fffa">PostgreSQL</text></g>
 </g>
 <!-- Pipeline card -->
 <rect x="54" y="525" width="630" height="132" rx="16" fill="url(#glass)" stroke="#4b4267" stroke-width="1.2"/>
 <text x="76" y="553" font-family="monospace" font-size="12" letter-spacing="2.5" fill="#9183b3">THE ANALYST LOOP</text>
 <g font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">
  <rect x="75" y="570" width="157" height="52" rx="10" fill="#22142e" stroke="#f45acb"/><text x="153.5" y="601" text-anchor="middle" fill="#ffe7f9">01 / CLEAN</text>
  <path d="M239 596H264" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 25;25 0" dur="1.5s" repeatCount="indefinite"/></path>
  <rect x="273" y="570" width="157" height="52" rx="10" fill="#19172d" stroke="#a58aff"/><text x="351.5" y="601" text-anchor="middle" fill="#efe7ff">02 / EXPLORE</text>
  <path d="M437 596H462" stroke="url(#cyan)" stroke-width="2.5" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 25;25 0" dur="1.5s" repeatCount="indefinite"/></path>
  <rect x="471" y="570" width="191" height="52" rx="10" fill="#0c2229" stroke="#42dcd2"/><text x="566.5" y="601" text-anchor="middle" fill="#d7fffa">03 / EXPLAIN</text>
 </g>
 <text x="57" y="695" font-family="monospace" font-size="15" letter-spacing="3" fill="#a89abc">BUILD WITH PURPOSE</text>
 <text x="57" y="720" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff2fc">KEEP CODING <tspan fill="#ff60ce">✦</tspan> KEEP GROWING<animate attributeName="opacity" values="1;.72;1;.4;1" dur="3.3s" repeatCount="indefinite"/></text>
 <!-- Character stage -->
 <g transform="translate(711 101)">
  <circle cx="253" cy="210" r="248" fill="none" stroke="#a78bfa" stroke-opacity=".28" stroke-dasharray="2 11"><animateTransform attributeName="transform" type="rotate" from="0 253 210" to="360 253 210" dur="85s" repeatCount="indefinite"/></circle>
  <circle cx="253" cy="210" r="222" fill="#120d25" fill-opacity=".72" stroke="url(#neon)" stroke-width="1.8"/>
  <circle cx="253" cy="210" r="196" fill="none" stroke="#48ddd6" stroke-opacity=".3" stroke-dasharray="8 8"><animateTransform attributeName="transform" type="rotate" from="360 253 210" to="0 253 210" dur="48s" repeatCount="indefinite"/></circle>
  <rect x="18" y="9" width="470" height="423" rx="22" fill="#0c0a18" fill-opacity=".32" stroke="#be8aff" stroke-opacity=".65"/>
  <g clip-path="url(#characterReveal)">
   <image xlink:href="https://raw.githubusercontent.com/prashantrix/prashantrix/main/assets/anime-data-analyst.png?v=4" href="https://raw.githubusercontent.com/prashantrix/prashantrix/main/assets/anime-data-analyst.png?v=4" x="7" y="-17" width="492" height="450" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <rect x="18" y="9" width="470" height="423" rx="22" fill="none" stroke="#ff64d1" stroke-opacity=".55" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".18;.85;.18" dur="3.1s" repeatCount="indefinite"/></rect>
  <rect x="18" y="18" width="470" height="3" rx="1.5" fill="#55ede1" filter="url(#glow)"><animate attributeName="y" values="18;426;18" dur="3.8s" repeatCount="indefinite"/></rect>
  <g transform="translate(38 28)">
   <rect width="156" height="27" rx="13" fill="#0b1524" stroke="#4bded4"/>
   <circle cx="15" cy="13.5" r="4" fill="#50e4d8"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
   <text x="28" y="18" font-family="monospace" font-size="11" letter-spacing="1" fill="#d6fffb">ANALYTICS.EXE</text>
  </g>
  <!-- floating data sparks -->
  <circle cx="26" cy="90" r="3" fill="#ff72d4"><animate attributeName="cy" values="90;68;90" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="478" cy="160" r="3" fill="#59e8df"><animate attributeName="cy" values="160;139;160" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="444" cy="388" r="2.5" fill="#fff0ff"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
 </g>
 <!-- Code card in foreground -->
 <g transform="translate(739 539)">
  <rect x="0" y="0" width="489" height="145" rx="15" fill="#080b16" stroke="url(#neon)" stroke-width="1.5" filter="url(#glow)"/>
  <path d="M0 40H489" stroke="#36304b" stroke-width="1"/>
  <circle cx="20" cy="20" r="4" fill="#ff628c"/><circle cx="34" cy="20" r="4" fill="#ffd166"/><circle cx="48" cy="20" r="4" fill="#46dfb2"/>
  <text x="67" y="25" font-family="monospace" font-size="12" fill="#8e85a8">insights.py</text>
  <g font-family="monospace" font-size="14">
   <text x="20" y="65" fill="#c4a4ff">df</text><text x="42" y="65" fill="#f3efff"> = clean(raw_data)<animate attributeName="opacity" values=".35;1" begin=".5s" dur=".5s" fill="freeze"/></text>
   <text x="20" y="91" fill="#c4a4ff">insights</text><text x="85" y="91" fill="#f3efff"> = find_patterns(df)<animate attributeName="opacity" values=".35;1" begin="1.1s" dur=".5s" fill="freeze"/></text>
   <text x="20" y="117" fill="#65e2d8">dashboard</text><text x="108" y="117" fill="#f3efff">.publish(insights)<animate attributeName="opacity" values=".35;1" begin="1.7s" dur=".5s" fill="freeze"/></text>
  </g>
 </g>
 <!-- ambient sparkles -->
 <g fill="#ffe6ff">
  <circle cx="703" cy="132" r="3"><animate attributeName="opacity" values=".1;1;.1" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="1228" cy="160" r="4"><animate attributeName="opacity" values=".1;1;.1" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1201" cy="478" r="2.5"><animate attributeName="opacity" values=".1;1;.1" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="702" cy="462" r="3"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="681" cy="346" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="1.5s" repeatCount="indefinite"/></circle>
 </g>
</g></svg>