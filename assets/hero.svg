<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">Prashant Kashyap — Data Analyst | AI Enthusiast</title>
<desc id="desc">A polished animated neon profile banner with a typing terminal, animated gradient name, skills, role and original anime analyst artwork.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090712"/><stop offset=".55" stop-color="#17102a"/><stop offset="1" stop-color="#0b1624"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4fc8"><animate attributeName="stop-color" values="#ff4fc8;#b78aff;#42ded7;#ff4fc8" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#9964ff"><animate attributeName="stop-color" values="#9964ff;#42ded7;#ff4fc8;#9964ff" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
 <radialGradient id="orb"><stop stop-color="#8b5cf6" stop-opacity=".26"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b5a8ff" stroke-opacity=".09"/></pattern>
 <clipPath id="round"><rect width="1280" height="600" rx="28"/></clipPath>
</defs>
<g clip-path="url(#round)">
 <rect width="1280" height="600" fill="url(#bg)"/><rect width="1280" height="600" fill="url(#grid)"/>
 <circle cx="990" cy="280" r="300" fill="url(#orb)"><animate attributeName="r" values="270;320;270" dur="7s" repeatCount="indefinite"/></circle>
 <rect x="3" y="3" width="1274" height="594" rx="25" fill="none" stroke="url(#neon)" stroke-width="2"/>
 <rect x="44" y="38" width="640" height="46" rx="10" fill="#090b15" stroke="#634c83"/>
 <circle cx="64" cy="61" r="5" fill="#ff668f"/><circle cx="82" cy="61" r="5" fill="#ffd166"/><circle cx="100" cy="61" r="5" fill="#49e2ad"/>
 <text x="122" y="67" font-family="monospace" font-size="16" fill="#c3b4e9">prashant@analytics:~$ <tspan fill="#ff79d4">whoami</tspan><tspan fill="#ffffff"> ▍<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
 <text x="52" y="143" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="4" fill="#9e8bbc">HELLO, WORLD. I'M</text>
 <text x="47" y="216" font-family="Arial,Helvetica,sans-serif" font-size="61" font-weight="800" letter-spacing="-1" fill="url(#neon)" filter="url(#glow)">PRASHANT</text>
 <text x="47" y="278" font-family="Arial,Helvetica,sans-serif" font-size="61" font-weight="800" letter-spacing="-1" fill="url(#neon)" filter="url(#glow)">KASHYAP</text>
 <path d="M52 296H635" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 600;580 20;0 600" dur="6s" repeatCount="indefinite"/></path>
 <text x="52" y="341" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#f8f1ff">Data Analyst <tspan fill="#ff77d4">·</tspan> AI Enthusiast</text>
 <text x="52" y="378" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#c9bedf">Turning data into insights, one query at a time.</text>
 <g font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">
  <g><rect x="52" y="405" width="86" height="36" rx="18" fill="#21132d" stroke="#ff6fd3"/><text x="95" y="428" text-anchor="middle" fill="#ffe1f7">SQL</text></g>
  <g><rect x="149" y="405" width="102" height="36" rx="18" fill="#21132d" stroke="#b08aff"/><text x="200" y="428" text-anchor="middle" fill="#ede0ff">Excel</text></g>
  <g><rect x="262" y="405" width="128" height="36" rx="18" fill="#21132d" stroke="#ff6fd3"/><text x="326" y="428" text-anchor="middle" fill="#ffe1f7">Power BI</text></g>
  <g><rect x="401" y="405" width="110" height="36" rx="18" fill="#21132d" stroke="#b08aff"/><text x="456" y="428" text-anchor="middle" fill="#ede0ff">Python</text></g>
  <g><rect x="522" y="405" width="140" height="36" rx="18" fill="#21132d" stroke="#ff6fd3"/><text x="592" y="428" text-anchor="middle" fill="#ffe1f7">PostgreSQL</text></g>
 </g>
 <rect x="52" y="467" width="610" height="82" rx="12" fill="#0b0916" stroke="#594071"/>
 <text x="72" y="491" font-family="monospace" font-size="12" fill="#8e81ae">ABOUT THIS BUILD</text>
 <text x="72" y="517" font-family="monospace" font-size="15" fill="#efe8ff">clean_data()  →  find_patterns()  →  share_insights()</text>
 <text x="72" y="538" font-family="monospace" font-size="12" fill="#ff84d7"># keep learning, keep building</text>
 <g transform="translate(710 72)">
   <circle cx="246" cy="238" r="235" fill="none" stroke="#a78bfa" stroke-opacity=".42" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0 246 238" to="360 246 238" dur="65s" repeatCount="indefinite"/></circle>
   <circle cx="246" cy="238" r="208" fill="#140d26" fill-opacity=".6" stroke="url(#neon)" stroke-width="1.5"/>
   <image xlink:href="https://raw.githubusercontent.com/prashantrix/prashantrix/main/assets/anime-data-analyst.png" href="https://raw.githubusercontent.com/prashantrix/prashantrix/main/assets/anime-data-analyst.png" x="30" y="3" width="432" height="470" preserveAspectRatio="xMidYMid meet"/>
   <rect x="14" y="20" width="464" height="434" rx="18" fill="none" stroke="#bd8cff" stroke-opacity=".58" stroke-width="1.5"/>
   <rect x="14" y="20" width="464" height="434" rx="18" fill="none" stroke="#ff67d5" stroke-opacity=".3" stroke-width="1"><animate attributeName="stroke-opacity" values=".15;.75;.15" dur="3s" repeatCount="indefinite"/></rect>
 </g>
 <g transform="translate(756 492)">
   <rect width="410" height="51" rx="11" fill="#0a0b17" stroke="#7b5ba4"/>
   <text x="18" y="21" font-family="monospace" font-size="12" fill="#9e8bbc">CURRENT MODE</text>
   <text x="18" y="40" font-family="monospace" font-size="15" fill="#e8dcff">DATA → DECISIONS <tspan fill="#ff76c8">●</tspan> ANALYTICS</text>
 </g>
 <g fill="#ffe4ff">
  <circle cx="688" cy="123" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="1204" cy="143" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="1188" cy="455" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="710" cy="467" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="1.6s" repeatCount="indefinite"/></circle>
 </g>
 <rect x="25" y="0" width="1230" height="3" rx="1.5" fill="#ff64d2" filter="url(#glow)"><animate attributeName="y" values="15;585;15" dur="3.5s" repeatCount="indefinite"/></rect>
</g></svg>