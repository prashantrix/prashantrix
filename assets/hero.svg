<!-- holographic analytics -->
<g transform="translate(932 100)">
  <rect width="260" height="95" rx="12" fill="#091522" fill-opacity=".9" stroke="#40e0d0" stroke-opacity=".65"/>
  <text x="16" y="23" font-family="monospace" font-size="11" fill="#40e0d0">DATA SIGNAL / 01</text>
  <path d="M16 70L52 53L83 61L122 37L154 48L197 28L243 35" stroke="#ff76c8" stroke-width="2.5" fill="none"/>
  <path d="M16 77H242" stroke="#42516f"/>
