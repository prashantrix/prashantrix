</g>
<g transform="translate(1000 350)">
  <rect width="191" height="78" rx="12" fill="#0a1524" stroke="#a78bfa" stroke-opacity=".7"/>
  <text x="14" y="23" font-family="monospace" font-size="10" fill="#b9a2ff">INSIGHT STATUS</text>
  <rect x="14" y="37" width="162" height="8" rx="4" fill="#222c46"/>
  <rect x="14" y="37" width="118" height="8" rx="4" fill="url(#neon)"><animate attributeName="width" values="70;150;70" dur="4s" repeatCount="indefinite"/></rect>
  <text x="14" y="64" font-family="monospace" font-size="10" fill="#aab7d1">CLEAN · QUERY · VISUALIZE</text>
