<g transform="translate(24 82)"><rect width="148" height="56" rx="10" fill="#24122e" stroke="#ff5fcf"/><text x="74" y="35" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffe3f7">SQL</text><rect x="160" width="165" height="56" rx="10" fill="#211932" stroke="#aa8aff"/><text x="242.5" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#f0e7ff">PostgreSQL</text></g><text x="24" y="166" font-family="Arial" font-size="14" fill="#beb6d2">Joins · aggregations · filtering</text><text x="24" y="188" font-family="Arial" font-size="14" fill="#beb6d2">Relational data · validation</text><path d="M24 203H345" stroke="#392440"/><circle cx="331" cy="18" r="3" fill="#ff63d0"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle></g></g>
<g class="rise" style="animation-delay:0.5s"><g transform="translate(453 139)"><rect width="374" height="224" rx="17" fill="#0f1524" stroke="#a58aff"/><rect x="18" y="18" width="40" height="40" rx="11" fill="#241a40" stroke="#a58aff"/><text x="38" y="45" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" fill="#f0e7ff">02</text><text x="73" y="35" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#c0a9ff">CLEAN &amp; EXPLORE</text><text x="73" y="55" font-family="Arial" font-size="19" font-weight="700" fill="#f8f0ff">Understand the shape</text>
<g transform="translate(24 82)"><rect width="148" height="56" rx="10" fill="#211932" stroke="#a58aff"/><text x="74" y="35" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#f0e7ff">Python</text><rect x="160" width="165" height="56" rx="10" fill="#211932" stroke="#ff69d2"/><text x="242.5" y="35" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffe3f7">Excel</text></g><text x="24" y="166" font-family="Arial" font-size="14" fill="#beb6d2">Cleaning · formulas · exploration</text><text x="24" y="188" font-family="Arial" font-size="14" fill="#beb6d2">Data quality · patterns · checks</text><path d="M24 203H345" stroke="#392440"/><circle cx="331" cy="18" r="3" fill="#a58aff"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle></g></g>
<g class="rise" style="animation-delay:0.75s"><g transform="translate(868 139)"><rect width="374" height="224" rx="17" fill="#0f1524" stroke="#4bdfd4"/><rect x="18" y="18" width="40" height="40" rx="11" fill="#123138" stroke="#4bdfd4"/><text x="38" y="45" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" fill="#d8fffb">03</text><text x="73" y="35" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#74e8e0">VISUALIZE &amp; SHARE</text><text x="73" y="55" font-family="Arial" font-size="19" font-weight="700" fill="#f0fffd">Make the answer clear</text>
<g transform="translate(24 82)"><rect width="325" height="56" rx="10" fill="#10262d" stroke="#4bdfd4"/><text x="162.5" y="35" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#dbfffb">Power BI</text></g><text x="24" y="166" font-family="Arial" font-size="14" fill="#beb6d2">KPIs · dashboard layout · DAX</text><text x="24" y="188" font-family="Arial" font-size="14" fill="#beb6d2">Trends · storytelling · reporting</text><path d="M24 203H345" stroke="#294446"/><circle cx="331" cy="18" r="3" fill="#4bdfd4"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle></g></g>
