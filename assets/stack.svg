<text x="40" y="41" font-family="monospace" font-size="13" letter-spacing="3" fill="#a99bbd">02 / MY TOOLKIT</text><text x="40" y="83" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f8f3ff">The right tool for the right question.</text><text x="40" y="111" font-family="Arial" font-size="15" fill="#bdb5d0">From extracting clean data to sharing a decision-ready dashboard.</text>
