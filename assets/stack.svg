<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
<title id="t">Prashant's analytics toolkit</title><desc id="d">A layered dashboard showing tools grouped by data querying, cleaning and reporting.</desc>
<defs><style>
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.petal{transform-box:fill-box;transform-origin:center;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0deg)}10%{opacity:.75}50%{transform:translate(calc(var(--dx)*.35 + 26px),calc(var(--dy)*.5)) rotate(calc(var(--r)*.5))}88%{opacity:.75}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.spark{animation:lift ease-in infinite}
@keyframes lift{0%{opacity:0;transform:translateY(0)}25%{opacity:.85}100%{opacity:0;transform:translateY(-120px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.petal,.spark{opacity:0}}
</style><clipPath id="fxc"><rect x="2" y="2" width="1276" height="416" rx="25"/></clipPath><linearGradient id="bg"><stop stop-color="#0a1220"/><stop offset="1" stop-color="#1a0f2c"/></linearGradient><linearGradient id="accent"><stop stop-color="#ff62cf"/><stop offset=".5" stop-color="#a58aff"/><stop offset="1" stop-color="#4bdfd4"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="2" y="2" width="1276" height="416" rx="25" fill="url(#bg)" stroke="#40355a" stroke-width="1.5"/>
