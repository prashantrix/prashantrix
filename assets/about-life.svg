<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="t d">
<title id="t">How Prashant approaches analytics</title><desc id="d">A custom animated panel showing a data workflow and the analyst's approach.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#17102d"/></linearGradient><linearGradient id="line"><stop stop-color="#40e0d0"/><stop offset=".55" stop-color="#9b7bff"/><stop offset="1" stop-color="#ff76c8"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="3" y="3" width="1274" height="384" rx="25" fill="url(#bg)" stroke="#34415d" stroke-width="2"/>
<path d="M0 95H1280 M0 285H1280" stroke="#b1c3ff" stroke-opacity=".06"/>
<text x="42" y="48" fill="#9ba8c6" font-family="monospace" font-size="15" letter-spacing="3">01 / MY APPROACH</text>
<text x="42" y="82" fill="#f5f7ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">From raw data to useful decisions.</text>
