<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="t d">
<title id="t">How Prashant thinks through an analytics problem</title><desc id="d">A polished three-step analytics workflow from messy source data to insights and communication.</desc>
<defs><linearGradient id="bg"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#1b0e2a"/></linearGradient><linearGradient id="accent"><stop stop-color="#ff5dcf"/><stop offset=".55" stop-color="#a98aff"/><stop offset="1" stop-color="#4de2d8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="2" y="2" width="1276" height="376" rx="25" fill="url(#bg)" stroke="#3f365b" stroke-width="1.5"/>
<g opacity=".13" stroke="#a9b7d3"><path d="M0 108H1280M0 310H1280"/><path d="M40 0V380M90 0V380M1190 0V380M1240 0V380"/></g>
<text x="40" y="41" font-family="monospace" font-size="13" letter-spacing="3" fill="#a99bbd">01 / HOW I WORK</text>
<text x="40" y="83" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f8f3ff">Good analysis starts with better questions.</text>
<text x="40" y="113" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#bdb5d0">I don't stop at charts — I look for the decision behind the data.</text>
<!-- connector flow -->
<path d="M300 225H422M707 225H828" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="0;-56" dur="3s" repeatCount="indefinite"/></path>
<!-- step one -->
<g transform="translate(38 145)"><rect width="340" height="176" rx="17" fill="#101323" stroke="#ff60ce"/><rect x="18" y="18" width="40" height="28" rx="8" fill="#3b1639" stroke="#ff6bd1"/><text x="38" y="37" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffe5fa">01</text><text x="74" y="37" font-family="Arial" font-size="17" font-weight="700" fill="#ffe7fa">COLLECT &amp; CLEAN</text>
<g transform="translate(22 65)" fill="none" stroke="#ff70d4" stroke-width="2"><ellipse cx="30" cy="9" rx="25" ry="8"/><path d="M5 9V50C5 61 55 61 55 50V9M5 28C5 39 55 39 55 28"/></g><g font-family="Arial" font-size="14" fill="#c9c2d8"><text x="100" y="83">Check the source</text><text x="100" y="108">Fix quality issues</text><text x="100" y="133">Validate assumptions</text></g><path d="M22 148H316" stroke="#352844"/><text x="22" y="165" font-family="monospace" font-size="11" fill="#ff91dc">TRUST THE INPUT</text></g>
<!-- step two -->
<g transform="translate(442 145)"><rect width="340" height="176" rx="17" fill="#101323" stroke="#a889ff"/><rect x="18" y="18" width="40" height="28" rx="8" fill="#261a43" stroke="#ac8aff"/><text x="38" y="37" text-anchor="middle" font-family="monospace" font-size="13" fill="#f2e9ff">02</text><text x="74" y="37" font-family="Arial" font-size="17" font-weight="700" fill="#f0e7ff">ANALYZE &amp; TEST</text>
<g transform="translate(24 67)" fill="none" stroke="#ac8aff" stroke-width="2.4"><path d="M0 50V10M0 50H64"/><rect x="10" y="29" width="9" height="21" rx="2" fill="#ac8aff" fill-opacity=".25"/><rect x="28" y="19" width="9" height="31" rx="2" fill="#ac8aff" fill-opacity=".45"/><rect x="46" y="5" width="9" height="45" rx="2" fill="#ac8aff" fill-opacity=".7"/><path d="M7 36L25 27L38 31L59 7" stroke="#f4c7ff"><animate attributeName="stroke-dasharray" values="0 100;100 0" dur="2s" repeatCount="indefinite"/></path></g><g font-family="Arial" font-size="14" fill="#c9c2d8"><text x="112" y="83">Find useful patterns</text><text x="112" y="108">Compare segments</text><text x="112" y="133">Challenge assumptions</text></g><path d="M22 148H316" stroke="#352844"/><text x="22" y="165" font-family="monospace" font-size="11" fill="#bea8ff">ASK WHY, NOT JUST WHAT</text></g>
<!-- step three -->
<g transform="translate(846 145)"><rect width="396" height="176" rx="17" fill="#101323" stroke="#4adfd5"/><rect x="18" y="18" width="40" height="28" rx="8" fill="#123139" stroke="#4adfd5"/><text x="38" y="37" text-anchor="middle" font-family="monospace" font-size="13" fill="#d9fffa">03</text><text x="74" y="37" font-family="Arial" font-size="17" font-weight="700" fill="#d8fffa">EXPLAIN &amp; IMPROVE</text>
<g transform="translate(23 72)" fill="none" stroke="#50e2d8" stroke-width="2"><rect x="0" y="0" width="65" height="48" rx="6"/><path d="M9 36V27H18V36M26 36V18H35V36M43 36V9H52V36"/><path d="M7 41H58" stroke-opacity=".4"/></g><g font-family="Arial" font-size="14" fill="#c9c2d8"><text x="112" y="83">Build useful views</text><text x="112" y="108">Show what matters</text><text x="112" y="133">Support the next action</text></g><path d="M22 148H372" stroke="#294446"/><text x="22" y="165" font-family="monospace" font-size="11" fill="#7df2e8">MAKE THE ANSWER USABLE</text></g>
<text x="40" y="356" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#8f85aa">CURIOSITY FIRST <tspan fill="#ff61ce">✦</tspan> EVIDENCE OVER GUESSES <tspan fill="#4ee3d9">✦</tspan> CLARITY OVER COMPLEXITY</text>
</svg>