<rect width="250" height="205" rx="16" fill="#0b1020" stroke="#51416f"/>
<text x="22" y="34" fill="#b9a2ff" font-family="monospace" font-size="14">02 · ANALYZE</text>
<g transform="translate(25 58)" fill="none" stroke="#b9a2ff" stroke-width="2"><path d="M0 73H190 M0 0V73"/><path d="M5 60L42 47 76 54 113 23 151 35 185 5" stroke="#ff78ca" stroke-width="3"/><circle cx="113" cy="23" r="4" fill="#ff78ca"/></g>
<g fill="#a1b2d3" font-family="Arial" font-size="15"><text x="22" y="162">Find patterns</text><text x="22" y="184">Test assumptions</text></g>
</g>
