<rect width="250" height="205" rx="16" fill="#0b1020" stroke="#59416f"/>
<text x="22" y="34" fill="#ff87d2" font-family="monospace" font-size="14">03 · COMMUNICATE</text>
<g transform="translate(26 59)"><rect x="0" y="0" width="196" height="74" rx="8" fill="#14172b" stroke="#484366"/><rect x="15" y="14" width="70" height="7" rx="3" fill="#6c4c9e"/><rect x="15" y="30" width="115" height="6" rx="3" fill="#3e8f95"/><rect x="15" y="45" width="91" height="6" rx="3" fill="#bf6ca7"/><path d="M151 55V38h11v17 M169 55V23h11v32" stroke="#40e0d0" stroke-width="8" fill="none"/></g>
<g fill="#a1b2d3" font-family="Arial" font-size="15"><text x="22" y="162">Build clear dashboards</text><text x="22" y="184">Explain what matters</text></g>
